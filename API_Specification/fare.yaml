openapi: 3.0.3

info:
  title: CAB System API - Fare & Payment
  description: |
    API Specification cho phân hệ Tính cước và Thanh toán
    của hệ thống đặt xe CAB.

    Bao gồm:
    - Xem cước thực tế sau khi chuyến đi hoàn thành (FR-20)
    - Xử lý kết quả thanh toán điện tử từ Payment Gateway (FR-24)
    - Xử lý thanh toán điện tử thất bại và ghi nhận kết quả (FR-25, FR-26)

    Thuộc UC04 - Thanh toán.
  version: 1.0.0

  contact:
    name: API Support
    email: support@cabsystem.vn


servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ


tags:
  - name: Fare
    description: Các API liên quan đến cước thực tế của chuyến đi

  - name: Payment
    description: Quản lý giao dịch thanh toán và tích hợp Payment Gateway


paths:

  # =========================================================
  # UC04 - THANH TOÁN
  # =========================================================

  /trips/{tripId}/fare:
    get:
      tags:
        - Fare

      summary: Xem cước thực tế của chuyến đi (UC04)

      description: |
        Truy xuất cước thực tế đã được hệ thống ghi nhận
        sau khi chuyến đi hoàn thành.

        API này không quy định công thức hoặc các thành phần
        tính cước cụ thể.

        Liên quan đến FR-20 và BRL-17.

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Cước thực tế của chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareResponse'

        '400':
          description: Chuyến đi chưa hoàn thành hoặc chưa có cước thực tế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /payments/webhook:
    post:
      tags:
        - Payment

      summary: Nhận kết quả thanh toán điện tử từ Payment Gateway (UC04)

      description: |
        Payment Gateway gửi kết quả giao dịch thanh toán điện tử
        về hệ thống CAB.

        Nếu thanh toán thành công, hệ thống ghi nhận kết quả
        thanh toán tương ứng.

        Nếu thanh toán thất bại, hệ thống ghi nhận kết quả thất bại
        và thông báo cho khách hàng để thực hiện lại hoặc xử lý lại
        theo chính sách của công ty.

        Liên quan đến FR-24, FR-25, FR-26,
        BRL-20, BRL-21 và BRL-22.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'

      responses:

        '200':
          description: Hệ thống CAB đã ghi nhận kết quả thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookResponse'

        '400':
          description: Dữ liệu kết quả thanh toán không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:

  # =========================================================
  # SECURITY
  # =========================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # =========================================================
  # COMMON RESPONSES
  # =========================================================

  responses:

    Unauthorized:
      description: |
        Người dùng chưa đăng nhập hoặc token đã hết hạn.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


  # =========================================================
  # SCHEMAS
  # =========================================================

  schemas:

    # -------------------------------------------------------
    # FARE
    # -------------------------------------------------------

    FareResponse:
      type: object

      properties:

        tripId:
          type: integer
          format: int64
          description: Mã chuyến đi

        actualFare:
          type: number
          format: double
          description: Cước thực tế của chuyến đi

        currency:
          type: string
          description: Đơn vị tiền tệ
          example: VND


    # -------------------------------------------------------
    # PAYMENT
    # -------------------------------------------------------

    PaymentWebhookPayload:
      type: object

      required:
        - tripId
        - transactionId
        - amount
        - paymentStatus

      properties:

        tripId:
          type: integer
          format: int64
          description: Mã chuyến đi trong hệ thống CAB

        transactionId:
          type: string
          description: Mã giao dịch do Payment Gateway cung cấp

        amount:
          type: number
          format: double
          description: Số tiền giao dịch

        paymentStatus:
          type: string
          enum:
            - SUCCESS
            - FAILED
          description: Kết quả giao dịch từ Payment Gateway

        message:
          type: string
          description: Thông tin kết quả hoặc lỗi từ Payment Gateway


    PaymentWebhookResponse:
      type: object

      properties:

        status:
          type: string
          example: OK

        paymentId:
          type: integer
          format: int64
          description: Mã thanh toán được hệ thống CAB ghi nhận


    ErrorResponse:
      type: object

      required:
        - code
        - message

      properties:

        code:
          type: string
          example: ERR_INVALID_INPUT

        message:
          type: string
          example: Thông tin đầu vào không hợp lệ.
