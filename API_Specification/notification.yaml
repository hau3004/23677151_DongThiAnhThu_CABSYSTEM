openapi: 3.0.3

info:
  title: CAB System API - Notification Services
  description: |
    API Specification cho phân hệ Thông báo của hệ thống CAB.

    Bao gồm:
    - API để người dùng truy xuất các thông báo đã được hệ thống ghi nhận
    - API để Notification Provider gửi kết quả xử lý thông báo
    - API nội bộ để các phân hệ của hệ thống yêu cầu gửi thông báo

    Thuộc UC05 - Gửi thông báo.
  version: 1.0.0

  contact:
    name: API Support
    email: support@cabsystem.vn


servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ


tags:
  - name: User Notifications
    description: API để Khách hàng và Tài xế truy xuất thông báo

  - name: Notification Provider
    description: Nhận kết quả xử lý thông báo từ nhà cung cấp dịch vụ thông báo

  - name: Internal System
    description: API nội bộ để các phân hệ của hệ thống yêu cầu gửi thông báo


paths:

  # =========================================================
  # UC05 - GỬI THÔNG BÁO
  # =========================================================

  /notifications:
    get:
      tags:
        - User Notifications

      summary: Xem thông báo của người dùng (UC05)

      description: |
        Khách hàng hoặc Tài xế gọi API để truy xuất
        các thông báo đã được hệ thống ghi nhận cho mình.

        API hỗ trợ việc hiển thị thông báo trên ứng dụng.

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'


  /notifications/provider/webhook:
    post:
      tags:
        - Notification Provider

      summary: Nhận kết quả xử lý thông báo từ Notification Provider

      description: |
        Nhà cung cấp dịch vụ thông báo gửi kết quả xử lý
        thông báo về hệ thống CAB.

        Hệ thống ghi nhận kết quả xử lý thông báo.

        Nếu việc gửi thông báo gặp sự cố, lỗi thông báo
        không được làm dừng toàn bộ hệ thống.

        Liên quan đến NFR-19 và EC-15.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderDeliveryReceipt'

      responses:

        '200':
          description: Đã ghi nhận kết quả xử lý thông báo

        '400':
          description: Dữ liệu kết quả thông báo không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /internal/notifications/send:
    post:
      tags:
        - Internal System

      summary: Yêu cầu gửi thông báo (UC05)

      description: |
        Các phân hệ của hệ thống yêu cầu gửi thông báo
        đến Khách hàng hoặc Tài xế khi xảy ra các sự kiện
        cần thông báo.

        Có thể sử dụng cho các thông báo:
        - Không tìm được tài xế
        - Tài xế chấp nhận chuyến
        - Kết quả thanh toán
        - Hoàn thành chuyến

        Chức năng thuộc UC05 - Gửi thông báo.

        Liên quan đến FR-27, FR-28, FR-29 và FR-30.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'

      responses:

        '202':
          description: Hệ thống đã tiếp nhận yêu cầu gửi thông báo

        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:

  # =========================================================
  # SECURITY
  # =========================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # =========================================================
  # COMMON RESPONSES
  # =========================================================

  responses:

    Unauthorized:
      description: |
        Người dùng chưa đăng nhập hoặc token đã hết hạn.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


  # =========================================================
  # SCHEMAS
  # =========================================================

  schemas:

    # -------------------------------------------------------
    # NOTIFICATION
    # -------------------------------------------------------

    NotificationResponse:
      type: object

      properties:

        notificationId:
          type: integer
          format: int64
          description: Mã thông báo

        notificationType:
          type: string
          description: |
            Loại thông báo được hệ thống gửi.
            Giá trị cụ thể do hệ thống quản lý.

        content:
          type: string
          description: Nội dung thông báo

        status:
          type: string
          description: Trạng thái xử lý thông báo

        sentTime:
          type: string
          format: date-time
          description: Thời gian gửi thông báo


    NotificationListResponse:
      type: object

      properties:

        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'

        total:
          type: integer
          description: Tổng số thông báo


    # -------------------------------------------------------
    # PROVIDER DELIVERY RECEIPT
    # -------------------------------------------------------

    ProviderDeliveryReceipt:
      type: object

      required:
        - notificationId
        - deliveryStatus

      properties:

        notificationId:
          type: integer
          format: int64
          description: Mã thông báo trong hệ thống CAB

        providerMessageId:
          type: string
          description: Mã tham chiếu của nhà cung cấp dịch vụ thông báo

        deliveryStatus:
          type: string
          description: Kết quả xử lý thông báo từ nhà cung cấp

        errorReason:
          type: string
          description: Lý do lỗi nếu việc gửi thông báo không thành công


    # -------------------------------------------------------
    # INTERNAL SEND NOTIFICATION
    # -------------------------------------------------------

    SendNotificationRequest:
      type: object

      required:
        - recipientType
        - recipientId
        - notificationType
        - content

      properties:

        recipientType:
          type: string
          description: Đối tượng nhận thông báo

        recipientId:
          type: integer
          format: int64
          description: Mã Khách hàng hoặc Tài xế nhận thông báo

        notificationType:
          type: string
          description: Loại thông báo

        content:
          type: string
          description: Nội dung thông báo


    # -------------------------------------------------------
    # ERROR
    # -------------------------------------------------------

    ErrorResponse:
      type: object

      required:
        - code
        - message

      properties:

        code:
          type: string
          example: ERR_INVALID_INPUT

        message:
          type: string
          example: Thông tin đầu vào không hợp lệ.
