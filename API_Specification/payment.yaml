```yaml
openapi: 3.0.3

info:
  title: CAB System API - Payment Management
  description: |
    API Specification cho phân hệ Thanh toán của hệ thống CAB.

    Bao gồm:
    - API tra cứu thông tin thanh toán của chuyến đi
    - Nhận kết quả thanh toán điện tử từ Payment Gateway

    Thuộc UC04 - Thanh toán.

    Liên quan đến FR-24, FR-25 và FR-26.
  version: 1.0.0

  contact:
    name: API Support
    email: support@cabsystem.vn


servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ


tags:
  - name: Payment Transactions
    description: Tra cứu thông tin thanh toán của chuyến đi

  - name: Payment Gateway
    description: Nhận kết quả thanh toán điện tử từ Payment Gateway


paths:

  # =========================================================
  # UC04 - THANH TOÁN
  # =========================================================

  /trips/{tripId}/payment:
    get:
      tags:
        - Payment Transactions

      summary: Xem thông tin thanh toán của chuyến đi (UC04)

      description: |
        Truy xuất thông tin thanh toán đã được hệ thống ghi nhận
        cho chuyến đi.

        API này hỗ trợ tra cứu trạng thái và thông tin giao dịch
        thanh toán.

        Đây là API hỗ trợ tra cứu dữ liệu và không đại diện
        cho một Business Requirement riêng trong SRS.

      security:
        - bearerAuth: []

      parameters:

        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Thông tin thanh toán của chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Không tìm thấy thông tin thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /payments/webhook:
    post:
      tags:
        - Payment Gateway

      summary: Nhận kết quả thanh toán điện tử từ Payment Gateway (UC04)

      description: |
        Payment Gateway gửi kết quả giao dịch thanh toán điện tử
        về hệ thống CAB.

        Hệ thống ghi nhận kết quả giao dịch theo kết quả
        do Payment Gateway trả về.

        Nếu thanh toán điện tử thành công, hệ thống ghi nhận
        kết quả thanh toán thành công.

        Nếu thanh toán điện tử thất bại, hệ thống ghi nhận
        kết quả thất bại và thông báo cho khách hàng để
        thực hiện lại hoặc xử lý lại theo chính sách của công ty.

        Liên quan đến FR-24, FR-25, FR-26,
        BRL-20, BRL-21 và BRL-22.

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'

      responses:

        '200':
          description: Hệ thống CAB đã ghi nhận kết quả thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentWebhookResponse'

        '400':
          description: Dữ liệu kết quả thanh toán không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:

  # =========================================================
  # SECURITY
  # =========================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # =========================================================
  # COMMON RESPONSES
  # =========================================================

  responses:

    Unauthorized:
      description: |
        Người dùng chưa đăng nhập hoặc token đã hết hạn.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


  # =========================================================
  # SCHEMAS
  # =========================================================

  schemas:

    # -------------------------------------------------------
    # PAYMENT
    # -------------------------------------------------------

    PaymentResponse:
      type: object

      properties:

        paymentId:
          type: integer
          format: int64
          description: Mã thanh toán

        tripId:
          type: integer
          format: int64
          description: Mã chuyến đi

        paymentMethod:
          type: string
          description: Phương thức thanh toán
          example: ELECTRONIC

        amount:
          type: number
          format: double
          description: Số tiền thanh toán

        paymentStatus:
          type: string
          description: Trạng thái thanh toán

        transactionId:
          type: string
          description: Mã giao dịch nếu có

        paymentTime:
          type: string
          format: date-time
          description: Thời điểm thanh toán


    # -------------------------------------------------------
    # PAYMENT WEBHOOK
    # -------------------------------------------------------

    PaymentWebhookPayload:
      type: object

      required:
        - tripId
        - transactionId
        - amount
        - paymentStatus

      properties:

        tripId:
          type: integer
          format: int64
          description: Mã chuyến đi trong hệ thống CAB

        transactionId:
          type: string
          description: Mã giao dịch do Payment Gateway cung cấp

        amount:
          type: number
          format: double
          description: Số tiền giao dịch

        paymentStatus:
          type: string
          enum:
            - SUCCESS
            - FAILED
          description: Kết quả giao dịch do Payment Gateway trả về

        message:
          type: string
          description: Thông tin kết quả hoặc lỗi từ Payment Gateway


    PaymentWebhookResponse:
      type: object

      properties:

        status:
          type: string
          example: OK

        paymentId:
          type: integer
          format: int64
          description: Mã thanh toán được hệ thống CAB ghi nhận


    # -------------------------------------------------------
    # ERROR
    # -------------------------------------------------------

    ErrorResponse:
      type: object

      required:
        - code
        - message

      properties:

        code:
          type: string
          example: ERR_INVALID_INPUT

        message:
          type: string
          example: Thông tin đầu vào không hợp lệ.
```
