openapi: 3.0.3
info:
  title: CAB System API - Admin & Operations
  description: |
    API Specification cho phân hệ Quản trị Vận hành của hệ thống CAB.
    Cung cấp các endpoints cho Nhân viên vận hành (OPERATOR) và Ban lãnh đạo (MANAGER) 
    để quản lý Khách hàng, Tài xế, Phương tiện, giám sát Chuyến đi, xử lý sự cố và xem Báo cáo thống kê.
  version: 1.0.0
  contact:
    name: API Support
    email: support@cabsystem.vn

servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ

tags:
  - name: Customer Management
    description: Tra cứu và quản lý trạng thái Khách hàng (FR-33)
  - name: Driver & Vehicle Management
    description: Tra cứu và quản lý hồ sơ Tài xế cùng Phương tiện (FR-34, FR-35)
  - name: Trip Operations
    description: Theo dõi chuyến đi và xử lý sự cố khẩn cấp (FR-36, FR-37)
  - name: Reports & Analytics
    description: Báo cáo doanh thu, số chuyến, tỷ lệ hoàn thành và hiệu quả hoạt động (FR-38, FR-39)

paths:
  /admin/customers:
    get:
      tags:
        - Customer Management
      summary: Lấy danh sách Khách hàng (UC33)
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Tìm kiếm theo tên, số điện thoại hoặc email
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, BLOCKED]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers/{customerId}/status:
    patch:
      tags:
        - Customer Management
      summary: Khóa/Mở khóa tài khoản Khách hàng
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, BLOCKED]
                reason:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/drivers:
    get:
      tags:
        - Driver & Vehicle Management
      summary: Lấy danh sách Tài xế (UC34, UC35)
      description: Lấy danh sách Tài xế kèm theo thông tin Phương tiện hiện tại.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACTIVE, BLOCKED]
        - name: readyStatus
          in: query
          schema:
            type: string
            enum: [AVAILABLE, UNAVAILABLE]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/drivers/{driverId}/status:
    patch:
      tags:
        - Driver & Vehicle Management
      summary: Phê duyệt, Khóa/Mở khóa Tài xế
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, BLOCKED]
                reason:
                  type: string
      responses:
        '200':
          description: Cập nhật thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/trips:
    get:
      tags:
        - Trip Operations
      summary: Giám sát toàn bộ chuyến đi (UC36)
      description: Vận hành viên sử dụng API này để tra cứu và theo dõi các chuyến đi (đặc biệt là các chuyến IN_PROGRESS để giám sát an toàn).
      security:
        - bearerAuth: []
      parameters:
        - name: tripStatus
          in: query
          schema:
            type: string
            enum: [PENDING, SEARCHING_DRIVER, DRIVER_ASSIGNED, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED]
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách các chuyến xe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripAdminListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/trips/{tripId}/cancel:
    post:
      tags:
        - Trip Operations
      summary: Hủy chuyến đi khẩn cấp (UC37)
      description: |
        Sử dụng trong tình huống sự cố (EC-09: Tài xế mất kết nối, xe hỏng giữa đường...).
        Nhân viên vận hành có quyền can thiệp hủy chuyến đi đang diễn ra và ghi nhận lý do.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Lý do hủy chuyến từ phía vận hành
      responses:
        '200':
          description: Hủy chuyến thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/reports/overview:
    get:
      tags:
        - Reports & Analytics
      summary: Báo cáo tổng quan hoạt động (UC38, UC39)
      description: |
        Ban lãnh đạo và Nhân viên vận hành xem các chỉ số cốt lõi: 
        Số chuyến, doanh thu, tỷ lệ hoàn thành/hủy (BR-11, BR-12).
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dữ liệu báo cáo tổng quan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token (Yêu cầu Role là OPERATOR hoặc MANAGER).

  responses:
    Unauthorized:
      description: Không có quyền truy cập (Chưa đăng nhập)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Hành động bị từ chối (Chỉ OPERATOR / MANAGER mới được gọi API này) (BRL-03)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Cust
