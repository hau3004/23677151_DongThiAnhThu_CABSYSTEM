openapi: 3.0.3

info:
  title: CAB System API - Matching & Dispatching
  description: |
    API Specification cho phân hệ Tìm và Phân công Tài xế
    của hệ thống đặt xe CAB.

    Bao gồm:
    - Nhận yêu cầu chuyến đi phía Tài xế
    - Khách hàng theo dõi tiến trình tìm tài xế
    - Trả về thông tin tài xế khi tài xế chấp nhận chuyến

    Thuộc UC03 - Quản lý chuyến đi.

    Liên quan đến FR-11, FR-12, FR-13, FR-14 và FR-15.
  version: 1.0.0

  contact:
    name: API Support
    email: support@cabsystem.vn


servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ


tags:
  - name: Driver Matching
    description: Nhận yêu cầu chuyến đi phía Tài xế

  - name: Customer Matching
    description: Khách hàng theo dõi tiến trình tìm tài xế


paths:

  # =========================================================
  # UC03 - QUẢN LÝ CHUYẾN ĐI
  # =========================================================

  /drivers/me/trip-requests/pending:
    get:
      tags:
        - Driver Matching

      summary: Xem yêu cầu chuyến đi đang chờ phản hồi (UC03)

      description: |
        Tài xế xem các yêu cầu chuyến đi mà hệ thống
        đang gửi đến để tài xế phản hồi.

        Chỉ các tài xế đang ở trạng thái sẵn sàng nhận chuyến
        mới được nhận yêu cầu phù hợp.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-12; hệ thống chỉ gửi yêu cầu
        cho tài xế phù hợp và đang sẵn sàng theo BRL-09.

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Danh sách yêu cầu chuyến đi đang chờ phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingTripRequestListResponse'

        '204':
          description: Hiện tại không có yêu cầu chuyến đi nào được phân công

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'


  /trips/{tripId}/matching-status:
    get:
      tags:
        - Customer Matching

      summary: Xem trạng thái tìm tài xế của chuyến đi (UC03)

      description: |
        Khách hàng xem trạng thái tìm tài xế của chuyến đi.

        Nếu tìm được tài xế, hệ thống trả về thông tin
        tài xế đã nhận chuyến.

        Nếu không tìm được tài xế phù hợp, hệ thống thông báo
        cho khách hàng và kết thúc quá trình tìm kiếm.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-11, FR-13, FR-15 và BR-17.

      security:
        - bearerAuth: []

      parameters:

        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:

        '200':
          description: Trạng thái tìm tài xế hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingStatusResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:

  # =========================================================
  # SECURITY
  # =========================================================

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # =========================================================
  # COMMON RESPONSES
  # =========================================================

  responses:

    Unauthorized:
      description: |
        Người dùng chưa đăng nhập hoặc token đã hết hạn.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


    Forbidden:
      description: |
        Người dùng đã đăng nhập nhưng không có quyền
        thực hiện chức năng này.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


  # =========================================================
  # SCHEMAS
  # =========================================================

  schemas:

    # -------------------------------------------------------
    # DRIVER MATCHING
    # -------------------------------------------------------

    PendingTripRequestListResponse:
      type: object

      properties:

        data:
          type: array
          items:
            $ref: '#/components/schemas/PendingTripRequest'

        total:
          type: integer
          description: Số lượng yêu cầu chuyến đi đang chờ phản hồi


    PendingTripRequest:
      type: object

      properties:

        tripId:
          type: integer
          format: int64
          description: Mã chuyến đi

        pickupLocation:
          type: string
          description: Điểm đón

        destination:
          type: string
          description: Điểm đến

        vehicleType:
          type: string
          description: Loại xe

        estimatedFare:
          type: number
          format: double
          description: Giá dự kiến của chuyến đi


    # -------------------------------------------------------
    # CUSTOMER MATCHING
    # -------------------------------------------------------

    MatchingStatusResponse:
      type: object

      properties:

        tripId:
          type: integer
          format: int64
          description: Mã chuyến đi

        status:
          type: string
          description: |
            Trạng thái hiện tại của quá trình tìm tài xế.
            Giá trị cụ thể do hệ thống quản lý.

        driverAssigned:
          type: object
          nullable: true
          description: |
            Thông tin tài xế đã nhận chuyến.
            Có giá trị khi chuyến đi đã được tài xế chấp nhận.

          properties:

            driverId:
              type: integer
              format: int64

            fullName:
              type: string

            phone:
              type: string

            vehicleType:
              type: string

            licensePlate:
              type: string

        message:
          type: string
          description: |
            Thông báo trạng thái tìm tài xế cho khách hàng.


    # -------------------------------------------------------
    # ERROR
    # -------------------------------------------------------

    ErrorResponse:
      type: object

      required:
        - code
        - message

      properties:

        code:
          type: string
          example: ERR_INVALID_INPUT

        message:
          type: string
          example: Thông tin đầu vào không hợp lệ.
