```yaml
openapi: 3.0.3

info:
  title: CAB System API - Driver Operations
  description: |
    API Specification cho phân hệ vận hành của Tài xế
    trong hệ thống đặt xe CAB.

    Bao gồm:
    - Nhận hoặc từ chối yêu cầu chuyến đi (UC03)
    - Cập nhật trạng thái chuyến đi (UC03)
    - Cập nhật vị trí tài xế (UC03)
    - Xác nhận thanh toán tiền mặt sau khi chuyến đi hoàn thành

    Liên quan đến:
    - FR-14: Xử lý tài xế từ chối hoặc không phản hồi
    - FR-16: Cập nhật trạng thái chuyến đi
    - FR-17: Cập nhật vị trí tài xế
    - FR-22: Tài xế xác nhận thanh toán tiền mặt
  version: 1.0.0

  contact:
    name: API Support
    email: support@cabsystem.vn


servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ


tags:
  - name: Trip Requests
    description: Xử lý yêu cầu chuyến đi của tài xế

  - name: Trip Execution
    description: Cập nhật trạng thái trong quá trình thực hiện chuyến đi

  - name: Driver Location
    description: Cập nhật vị trí của tài xế


paths:

  # =========================================================
  # UC03 - QUẢN LÝ CHUYẾN ĐI
  # =========================================================

  /drivers/me/trips/requests/{tripId}/accept:
    post:
      tags:
        - Trip Requests
      summary: Chấp nhận yêu cầu chuyến đi (UC03)
      description: |
        Tài xế chấp nhận yêu cầu chuyến đi do hệ thống gửi đến.

        Khi tài xế chấp nhận, chuyến đi được xác nhận
        và hệ thống thông báo thông tin cần thiết cho khách hàng.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến BRL-12.

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:
        '200':
          description: Tài xế nhận chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '400':
          description: Chuyến đi không còn ở trạng thái có thể nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'


  /drivers/me/trips/requests/{tripId}/reject:
    post:
      tags:
        - Trip Requests
      summary: Từ chối yêu cầu chuyến đi (UC03)
      description: |
        Tài xế từ chối yêu cầu chuyến đi.

        Sau khi tài xế từ chối, hệ thống tiếp tục tìm
        tài xế khác mà khách hàng không phải tạo lại yêu cầu.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-14 và BRL-11.

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:
        '204':
          description: Từ chối yêu cầu chuyến đi thành công

        '400':
          description: Yêu cầu chuyến đi không còn hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'


  /drivers/me/trips/{tripId}/status:
    patch:
      tags:
        - Trip Execution
      summary: Cập nhật trạng thái chuyến đi (UC03)
      description: |
        Tài xế cập nhật trạng thái chuyến đi trong quá trình thực hiện.

        Các trạng thái do tài xế cập nhật theo đúng trình tự nghiệp vụ:
        ARRIVED -> PICKED_UP -> IN_PROGRESS -> COMPLETED.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-16, BRL-14 và BRL-16.

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequest'

      responses:
        '200':
          description: Cập nhật trạng thái chuyến đi thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '400':
          description: Trạng thái cập nhật không hợp lệ hoặc sai trình tự
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'


  /drivers/me/trips/{tripId}/cash-confirm:
    post:
      tags:
        - Trip Execution
      summary: Xác nhận đã nhận tiền mặt
      description: |
        Tài xế xác nhận đã nhận tiền mặt từ khách hàng
        sau khi chuyến đi hoàn thành.

        Đây là thao tác của tài xế trong quy trình thanh toán
        tiền mặt của UC04 - Thanh toán.
        Không xem Tài xế là actor của UC04 ở mức Use Case tổng thể.

        Liên quan đến FR-22, BRL-18 và BRL-19.

      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: Mã chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:
        '200':
          description: Xác nhận thanh toán tiền mặt thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

        '400':
          description: Chuyến đi không sử dụng phương thức thanh toán tiền mặt hoặc chưa hoàn thành
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'


  /drivers/me/location:
    post:
      tags:
        - Driver Location
      summary: Cập nhật vị trí tài xế (UC03)
      description: |
        Tài xế gửi vị trí hiện tại để hệ thống cập nhật.

        Vị trí được sử dụng để hỗ trợ theo dõi chuyến đi,
        tìm tài xế phù hợp và cung cấp thông tin vị trí/ETA
        cho khách hàng.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-17 và BRL-15.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdateRequest'

      responses:
        '204':
          description: Cập nhật vị trí thành công

        '400':
          description: Dữ liệu vị trí không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  responses:

    Unauthorized:
      description: |
        Người dùng chưa đăng nhập hoặc token đã hết hạn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


    Forbidden:
      description: |
        Người dùng đã đăng nhập nhưng không có quyền
        thực hiện chức năng này.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


  schemas:

    UpdateTripStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ARRIVED
            - PICKED_UP
            - IN_PROGRESS
            - COMPLETED
          description: |
            Trạng thái tiếp theo của chuyến đi.
            Hệ thống kiểm tra trạng thái có đúng trình tự nghiệp vụ hay không.


    LocationUpdateRequest:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          description: Vĩ độ hiện tại của tài xế
          example: 10.762622

        longitude:
          type: number
          format: double
          description: Kinh độ hiện tại của tài xế
          example: 106.660172


    TripResponse:
      type: object
      properties:
        tripId:
          type: integer
          format: int64

        customerId:
          type: integer
          format: int64

        driverId:
          type: integer
          format: int64

        pickupLocation:
          type: string

        destination:
          type: string

        vehicleType:
          type: string

        estimatedFare:
          type: number
          format: double

        actualFare:
          type: number
          format: double

        tripStatus:
          type: string
          enum:
            - PENDING
            - SEARCHING_DRIVER
            - DRIVER_ASSIGNED
            - CONFIRMED
            - ARRIVED
            - PICKED_UP
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED

        paymentMethod:
          type: string
          enum:
            - CASH
            - ELECTRONIC


    PaymentResponse:
      type: object
      properties:
        paymentId:
          type: integer
          format: int64

        tripId:
          type: integer
          format: int64

        paymentMethod:
          type: string
          description: Phương thức thanh toán

        amount:
          type: number
          format: double
          description: Số tiền thanh toán

        paymentStatus:
          type: string
          description: Trạng thái thanh toán

        paymentTime:
          type: string
          format: date-time


    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ERR_INVALID_INPUT

        message:
          type: string
          example: Thông tin đầu vào không hợp lệ.
```
