```yaml
openapi: 3.0.3

info:
  title: CAB System API - Booking & Tracking
  description: |
    API Specification cho phân hệ Đặt xe và Theo dõi chuyến của hệ thống CAB.
    Cho phép Khách hàng tính giá dự kiến, tạo chuyến, theo dõi tài xế,
    xem lịch sử chuyến đi và hủy chuyến.
  version: 1.0.0
  contact:
    name: API Support
    email: support@cabsystem.vn

servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ

tags:
  - name: Booking
    description: Các API liên quan đến quá trình tạo yêu cầu đặt xe

  - name: Tracking & Execution
    description: Các API theo dõi trạng thái và vị trí chuyến đi

  - name: Trip History
    description: Quản lý lịch sử chuyến đi

paths:

  /trips/estimate:
    post:
      tags:
        - Booking
      summary: Tính giá dự kiến (UC07)
      description: |
        Tính toán và trả về giá cước dự kiến dựa trên điểm đón,
        điểm đến và loại xe (FR-06, BRL-06).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: Tính giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '400':
          description: Thông tin yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trips:
    post:
      tags:
        - Booking
      summary: Tạo yêu cầu đặt xe (UC09)
      description: |
        Khách hàng xác nhận đặt xe.

        Nếu thanh toán tiền mặt, chuyến được tạo và chuyển sang
        trạng thái SEARCHING_DRIVER (BRL-08).

        Nếu thanh toán điện tử, hệ thống xử lý yêu cầu thanh toán
        trước khi tạo booking request (BRL-09).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '400':
          description: Thông tin đặt xe không hợp lệ (EC-01)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - Trip History
      summary: Xem lịch sử chuyến đi (UC11)
      description: |
        Lấy danh sách các chuyến đi của khách hàng hiện tại (FR-10).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Lọc theo trạng thái chuyến
          schema:
            type: string
            enum:
              - PENDING
              - SEARCHING_DRIVER
              - DRIVER_ASSIGNED
              - CONFIRMED
              - IN_PROGRESS
              - COMPLETED
              - CANCELLED

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

      responses:
        '200':
          description: Danh sách chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trips/{tripId}:
    get:
      tags:
        - Tracking & Execution
      summary: Xem chi tiết và trạng thái chuyến đi (UC10)
      description: |
        Lấy chi tiết chuyến đi, trạng thái hiện tại và thông tin
        tài xế/phương tiện nếu đã được phân công.
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:
        '200':
          description: Chi tiết chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/driver-location:
    get:
      tags:
        - Tracking & Execution
      summary: Theo dõi vị trí tài xế (UC10)
      description: |
        Lấy tọa độ GPS mới nhất của tài xế để hiển thị trên bản đồ (NFR-04).
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:
        '200':
          description: Tọa độ hiện tại của tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Chưa có dữ liệu vị trí hoặc không tìm thấy chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/cancel:
    post:
      tags:
        - Tracking & Execution
      summary: Hủy chuyến đi (UC19)
      description: |
        Khách hàng yêu cầu hủy chuyến.
        Trạng thái chuyến sẽ chuyển sang CANCELLED (BRL-15, EC-08).
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'

      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '400':
          description: Không thể hủy chuyến ở trạng thái hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:

    Unauthorized:
      description: |
        Không có quyền truy cập.
        Người dùng chưa đăng nhập hoặc token đã hết hạn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:

    EstimateRequest:
      type: object
      required:
        - pickupLocation
        - destination
        - vehicleType
      properties:
        pickupLocation:
          type: string
          description: Địa điểm đón
          example: "123 Lê Lợi, Q.1, TP.HCM"

        destination:
          type: string
          description: Địa điểm đến
          example: "Sân bay Tân Sơn Nhất"

        vehicleType:
          type: string
          description: Loại phương tiện
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
            - MOTORBIKE

    EstimateResponse:
      type: object
      properties:
        estimatedFare:
          type: number
          format: double
          description: Giá cước dự kiến
          example: 125000

        distanceKm:
          type: number
          format: double
          description: Khoảng cách dự kiến tính bằng km
          example: 7.5

    BookingRequest:
      type: object
      required:
        - pickupLocation
        - destination
        - vehicleType
        - paymentMethod
      properties:
        pickupLocation:
          type: string
          description: Địa điểm đón
          example: "123 Lê Lợi, Q.1, TP.HCM"

        destination:
          type: string
          description: Địa điểm đến
          example: "Sân bay Tân Sơn Nhất"

        vehicleType:
          type: string
          description: Loại phương tiện
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
            - MOTORBIKE

        paymentMethod:
          type: string
          description: Phương thức thanh toán
          enum:
            - CASH
            - E_WALLET
            - CREDIT_CARD

    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          description: Lý do hủy chuyến
          example: "Thay đổi kế hoạch"

    TripResponse:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
          example: 10001

        customerId:
          type: integer
          format: int64
          example: 20001

        pickupLocation:
          type: string
          example: "123 Lê Lợi, Q.1, TP.HCM"

        destination:
          type: string
          example: "Sân bay Tân Sơn Nhất"

        vehicleType:
          type: string
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
            - MOTORBIKE

        estimatedFare:
          type: number
          format: double
          example: 125000

        tripStatus:
          type: string
          enum:
            - PENDING
            - SEARCHING_DRIVER
            - DRIVER_ASSIGNED
            - CONFIRMED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED

        payment:
          $ref: '#/components/schemas/PaymentInfo'

    PaymentInfo:
      type: object
      properties:
        paymentStatus:
          type: string
          enum:
            - PENDING
            - PAID
            - FAILED
            - UNPAID

        paymentUrl:
          type: string
          format: uri
          description: URL thanh toán nếu chọn thanh toán điện tử
          example: "https://payment.example.com/pay/abc123"

    TripDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TripResponse'

        - type: object
          properties:
            actualFare:
              type: number
              format: double
              description: Giá cước thực tế sau khi hoàn thành chuyến

            driver:
              $ref: '#/components/schemas/DriverInfo'

            startTime:
              type: string
              format: date-time
              description: Thời điểm bắt đầu chuyến

            endTime:
              type: string
              format: date-time
              description: Thời điểm kết thúc chuyến

    DriverInfo:
      type: object
      properties:
        driverId:
          type: integer
          format: int64

        fullName:
          type: string

        phone:
          type: string

        licensePlate:
          type: string

    TripListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TripDetailResponse'

        total:
          type: integer
          description: Tổng số chuyến

    LocationResponse:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 10.7769

        longitude:
          type: number
          format: double
          example: 106.7009

        heading:
          type: number
          format: float
          description: Hướng di chuyển của tài xế

        updatedAt:
          type: string
          format: date-time
          description: Thời điểm cập nhật vị trí gần nhất

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST

        message:
          type: string
          example: Thông tin yêu cầu không hợp lệ
```


