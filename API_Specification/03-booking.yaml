openapi: 3.0.3
info:
  title: CAB System API - Booking & Tracking
  description: |
    API Specification cho phân hệ Đặt xe và Theo dõi chuyến của hệ thống CAB.
    Cho phép Khách hàng tính giá dự kiến, tạo chuyến, theo dõi tài xế, hủy chuyến và đánh giá sau chuyến đi.
  version: 1.0.0
  contact:
    name: API Support
    email: support@cabsystem.vn

servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ

tags:
  - name: Booking
    description: Các API liên quan đến quá trình tạo yêu cầu đặt xe
  - name: Tracking & Execution
    description: Các API theo dõi trạng thái và vị trí chuyến đi
  - name: Rating & History
    description: Quản lý lịch sử chuyến đi và đánh giá tài xế

paths:
  /trips/estimate:
    post:
      tags:
        - Booking
      summary: Tính giá dự kiến (UC07)
      description: |
        Tính toán và trả về giá cước dự kiến dựa trên điểm đón, điểm đến và loại xe (FR-06, BRL-06).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: Tính giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trips:
    post:
      tags:
        - Booking
      summary: Tạo yêu cầu đặt xe (UC09)
      description: |
        Khách hàng xác nhận đặt xe. 
        Nếu thanh toán tiền mặt, chuyến chuyển sang SEARCHING_DRIVER ngay lập tức (BRL-08).
        Nếu thanh toán điện tử, hệ thống trả về thông tin giao dịch để thanh toán trước (BRL-09).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '201':
          description: Tạo yêu cầu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '400':
          description: Thông tin đặt xe không hợp lệ (EC-01)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - Rating & History
      summary: Xem lịch sử chuyến đi (UC11)
      description: Lấy danh sách các chuyến đi đã thực hiện của khách hàng hiện tại (FR-10).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái chuyến (VD: COMPLETED, CANCELLED)
          required: false
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Danh sách chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /trips/{tripId}:
    get:
      tags:
        - Tracking & Execution
      summary: Xem chi tiết và trạng thái chuyến đi (UC10)
      description: Lấy chi tiết chuyến đi, trạng thái hiện tại và thông tin Tài xế/Phương tiện (nếu có).
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chi tiết chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Không tìm thấy chuyến đi

  /trips/{tripId}/driver-location:
    get:
      tags:
        - Tracking & Execution
      summary: Theo dõi vị trí tài xế (UC10)
      description: Lấy tọa độ GPS mới nhất của tài xế để hiển thị lên bản đồ (NFR-04).
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Tọa độ hiện tại của tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
        '404':
          description: Chưa có dữ liệu vị trí hoặc không tìm thấy chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/cancel:
    post:
      tags:
        - Tracking & Execution
      summary: Hủy chuyến đi (UC19)
      description: |
        Khách hàng yêu cầu hủy chuyến. Trạng thái chuyến sẽ chuyển sang CANCELLED (BRL-15, EC-08).
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Lý do hủy chuyến
      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '400':
          description: Không thể hủy chuyến ở trạng thái hiện tại (vd: Chuyến đang IN_PROGRESS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips/{tripId}/rating:
    post:
      tags:
        - Rating & History
      summary: Đánh giá tài xế (UC31)
      description: Khách hàng đánh giá tài xế sau khi chuyến đi hoàn thành (BRL-25).
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
        '400':
          description: Chuyến chưa hoàn thành hoặc đánh giá không hợp lệ (EC-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Không có quyền truy cập (Chưa đăng nhập hoặc token hết hạn)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    EstimateRequest:
      type: object
      required:
        - pickupLocation
        - destination
        - vehicleType
      properties:
        pickupLocation:
          type: string
          example: "123 Lê Lợi, Q.1, TP.HCM"
        destination:
          type: string
          example: "Sân bay Tân Sơn Nhất"
        vehicleType:
          type: string
          enum: [CAR_4_SEATS, CAR_7_SEATS, MOTORBIKE]

    EstimateResponse:
      type: object
      properties:
        estimatedFare:
          type: number
          format: double
          example: 125000
        distanceKm:
          type: number
          format: double
          example: 7.5

    BookingRequest:
      type: object
      required:
        - pickupLocation
        - destination
        - vehicleType
        - paymentMethod
      properties:
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
          enum: [CAR_4_SEATS, CAR_7_SEATS, MOTORBIKE]
        paymentMethod:
          type: string
          enum: [CASH, E_WALLET, CREDIT_CARD]

    TripResponse:
      type: object
      properties:
        tripId:
          type: integer
        customerId:
          type: integer
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
        estimatedFare:
          type: number
        tripStatus:
          type: string
          enum: [PENDING, SEARCHING_DRIVER, DRIVER_ASSIGNED, CONFIRMED, IN_PROGRESS, COMPLETED, CANCELLED]
        payment:
          type: object
          properties:
            paymentStatus:
              type: string
              enum: [PENDING, PAID, FAILED, UNPAID]
            paymentUrl:
              type: string
              description: URL thanh toán (Nếu chọn thanh toán điện tử)

    TripDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TripResponse'
        - type: object
          properties:
            actualFare:
              type: number
            driver:
              type: object
              properties:
                driverId:
                  type: integer
                fullName:
                  type: string
                phone:
                  type: string
                licensePlate:
                  type: string
            startTime:
              type: string
              format: date-time
            endTime:
              type: string
              format: date-time

    TripListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TripDetailResponse'
        total:
          type: integer

    LocationResponse:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
        heading:
          type: number
        updatedAt:
          type: string
          format: date-time

    RatingRequest:
      type: object
      required:
        - ratingScore
      properties:
        ratingScore:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    ErrorResponse:
      type: object
      properties:
