```yaml
openapi: 3.0.3

info:
  title: CAB System API - Booking & Tracking
  description: |
    API Specification cho phân hệ Đặt xe và Theo dõi chuyến của hệ thống CAB.
    Cho phép Khách hàng tính giá dự kiến, tạo yêu cầu đặt xe,
    theo dõi chuyến đi, xem lịch sử chuyến đi và hủy chuyến.
  version: 1.0.0
  contact:
    name: API Support
    email: support@cabsystem.vn

servers:
  - url: https://api.cabsystem.local/v1
    description: Môi trường phát triển cục bộ

tags:
  - name: Booking
    description: Các API liên quan đến quá trình đặt xe

  - name: Tracking & Execution
    description: Các API theo dõi trạng thái và vị trí chuyến đi

  - name: Trip History
    description: Các API liên quan đến lịch sử chuyến đi

paths:

  /trips/estimate:
    post:
      tags:
        - Booking
      summary: Tính giá dự kiến
      description: |
        Tính toán và trả về giá cước dự kiến dựa trên
        điểm đón, điểm đến và loại xe.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-06 và BRL-06.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'

      responses:
        '200':
          description: Tính giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'

        '400':
          description: Thông tin yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'


  /trips:
    post:
      tags:
        - Booking
      summary: Tạo yêu cầu đặt xe
      description: |
        Khách hàng xác nhận đặt xe.

        Hệ thống tạo yêu cầu chuyến và bắt đầu quá trình
        tìm tài xế phù hợp.

        Phương thức thanh toán được khách hàng lựa chọn
        trước khi đặt xe. Việc thanh toán thực tế được
        thực hiện sau khi chuyến hoàn thành.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-05, FR-07, FR-08 và BRL-08.
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'

      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '400':
          description: Thông tin đặt xe không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'


    get:
      tags:
        - Trip History
      summary: Xem lịch sử chuyến đi
      description: |
        Lấy danh sách các chuyến đi của khách hàng hiện tại.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-10.
      security:
        - bearerAuth: []

      parameters:
        - name: status
          in: query
          required: false
          description: Lọc theo trạng thái chuyến
          schema:
            $ref: '#/components/schemas/TripStatus'

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

      responses:
        '200':
          description: Danh sách chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'


  /trips/{tripId}:
    get:
      tags:
        - Tracking & Execution
      summary: Xem chi tiết và trạng thái chuyến đi
      description: |
        Lấy thông tin chi tiết chuyến đi, trạng thái hiện tại
        và thông tin tài xế/phương tiện nếu đã được phân công.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan trực tiếp đến FR-09.

        Trạng thái chuyến được cập nhật theo FR-16.
      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:
        '200':
          description: Chi tiết chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /trips/{tripId}/driver-location:
    get:
      tags:
        - Tracking & Execution
      summary: Lấy vị trí tài xế
      description: |
        Lấy tọa độ GPS mới nhất của tài xế để khách hàng
        theo dõi vị trí trong quá trình thực hiện chuyến.

        API này cung cấp dữ liệu vị trí đã được hệ thống
        cập nhật theo FR-17.
      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      responses:
        '200':
          description: Tọa độ hiện tại của tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Chưa có dữ liệu vị trí hoặc không tìm thấy chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


  /trips/{tripId}/cancel:
    post:
      tags:
        - Tracking & Execution
      summary: Hủy chuyến đi
      description: |
        Khách hàng yêu cầu hủy chuyến.

        Hệ thống kiểm tra điều kiện hủy và cập nhật
        trạng thái chuyến theo chính sách của công ty.

        Chức năng thuộc UC03 - Quản lý chuyến đi.
        Liên quan đến FR-18 và BRL-13.
      security:
        - bearerAuth: []

      parameters:
        - name: tripId
          in: path
          required: true
          description: ID của chuyến đi
          schema:
            type: integer
            format: int64
            minimum: 1

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'

      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'

        '400':
          description: Không thể hủy chuyến ở trạng thái hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Không tìm thấy chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  responses:

    Unauthorized:
      description: |
        Không có quyền truy cập.
        Người dùng chưa đăng nhập hoặc token đã hết hạn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


  schemas:

    EstimateRequest:
      type: object
      required:
        - pickupLocation
        - destination
        - vehicleType
      properties:
        pickupLocation:
          type: string
          description: Địa điểm đón
          example: "123 Lê Lợi, Q.1, TP.HCM"

        destination:
          type: string
          description: Địa điểm đến
          example: "Sân bay Tân Sơn Nhất"

        vehicleType:
          type: string
          description: Loại phương tiện
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
            - MOTORBIKE


    EstimateResponse:
      type: object
      properties:
        estimatedFare:
          type: number
          format: double
          description: Giá cước dự kiến
          example: 125000

        distanceKm:
          type: number
          format: double
          description: Khoảng cách dự kiến tính bằng km
          example: 7.5


    BookingRequest:
      type: object
      required:
        - pickupLocation
        - destination
        - vehicleType
        - paymentMethod
      properties:
        pickupLocation:
          type: string
          description: Địa điểm đón
          example: "123 Lê Lợi, Q.1, TP.HCM"

        destination:
          type: string
          description: Địa điểm đến
          example: "Sân bay Tân Sơn Nhất"

        vehicleType:
          type: string
          description: Loại phương tiện
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
            - MOTORBIKE

        paymentMethod:
          type: string
          description: |
            Phương thức thanh toán được khách hàng lựa chọn
            trước khi đặt xe. Việc thanh toán thực tế được
            thực hiện sau khi chuyến hoàn thành.
          enum:
            - CASH
            - ELECTRONIC


    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          description: Lý do hủy chuyến
          example: "Thay đổi kế hoạch"


    TripStatus:
      type: string
      description: Trạng thái của chuyến đi
      enum:
        - PENDING
        - SEARCHING_DRIVER
        - DRIVER_ASSIGNED
        - CONFIRMED
        - ARRIVED
        - PICKED_UP
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED


    TripResponse:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
          example: 10001

        customerId:
          type: integer
          format: int64
          example: 20001

        pickupLocation:
          type: string
          example: "123 Lê Lợi, Q.1, TP.HCM"

        destination:
          type: string
          example: "Sân bay Tân Sơn Nhất"

        vehicleType:
          type: string
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
            - MOTORBIKE

        estimatedFare:
          type: number
          format: double
          description: Giá cước dự kiến
          example: 125000

        paymentMethod:
          type: string
          description: Phương thức thanh toán đã được lựa chọn
          enum:
            - CASH
            - ELECTRONIC

        tripStatus:
          $ref: '#/components/schemas/TripStatus'


    TripDetailResponse:
      allOf:
        - $ref: '#/components/schemas/TripResponse'

        - type: object
          properties:
            actualFare:
              type: number
              format: double
              description: Giá cước thực tế sau khi chuyến hoàn thành

            driver:
              $ref: '#/components/schemas/DriverInfo'

            vehicle:
              $ref: '#/components/schemas/VehicleInfo'

            startTime:
              type: string
              format: date-time
              description: Thời điểm bắt đầu chuyến

            endTime:
              type: string
              format: date-time
              description: Thời điểm kết thúc chuyến


    TripHistoryItem:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
          example: 10001

        pickupLocation:
          type: string
          example: "123 Lê Lợi, Q.1, TP.HCM"

        destination:
          type: string
          example: "Sân bay Tân Sơn Nhất"

        vehicleType:
          type: string
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
            - MOTORBIKE

        estimatedFare:
          type: number
          format: double
          example: 125000

        actualFare:
          type: number
          format: double
          description: Cước thực tế nếu chuyến đã hoàn thành

        tripStatus:
          $ref: '#/components/schemas/TripStatus'

        startTime:
          type: string
          format: date-time

        endTime:
          type: string
          format: date-time


    TripListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TripHistoryItem'

        total:
          type: integer
          description: Tổng số chuyến


    DriverInfo:
      type: object
      properties:
        driverId:
          type: integer
          format: int64

        fullName:
          type: string

        phone:
          type: string


    VehicleInfo:
      type: object
      properties:
        vehicleId:
          type: integer
          format: int64

        vehicleType:
          type: string
          enum:
            - CAR_4_SEATS
            - CAR_7_SEATS
            - MOTORBIKE

        licensePlate:
          type: string


    LocationResponse:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 10.7769

        longitude:
          type: number
          format: double
          example: 106.7009

        heading:
          type: number
          format: float
          description: Hướng di chuyển của tài xế

        updatedAt:
          type: string
          format: date-time
          description: Thời điểm cập nhật vị trí gần nhất


    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_REQUEST

        message:
          type: string
          example: Thông tin yêu cầu không hợp lệ
```

